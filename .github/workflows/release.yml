name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi]
        default: testpypi

jobs:
  build:
    # Runs for any release: building the package is a cheap sanity check even
    # when nothing will be published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # A tag that points at the wrong commit builds the wrong version and is
      # only caught at upload, by which point the release is already published.
      # Fail here instead, where it costs seconds and nothing is public yet.
      - name: Built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.whl | sed -E 's/.*compileml-([^-]+)-py3.*/\1/')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag builds version $built - the tag probably points at a commit before the version bump"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Only version tags publish. A release is also how non-code assets are
    # distributed — the credit panel behind compileml.datasets is attached to
    # the data-v1 tag — and publishing the current source to PyPI is not a
    # sensible response to one of those. PyPI refuses to reuse a filename, so
    # the failure was loud rather than damaging, but the job should never
    # have been offered in the first place.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
