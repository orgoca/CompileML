name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install GnuCOBOL (COBOL run-parity test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Install package
        run: pip install -e .[dev]
      - name: Install optional teachers (Linux only)
        if: runner.os == 'Linux'
        run: pip install xgboost lightgbm
      - name: Run tests (includes the cross-platform determinism oracle)
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check src tests benchmarks
      - run: black --check src tests benchmarks
      - name: mypy (advisory)
        run: mypy src/compileml
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[docs]
      - run: mkdocs build --strict

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] nbclient nbformat ipykernel
      - name: Execute every example notebook
        run: python .github/scripts/run_notebooks.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          pip install dist/*.whl
          python -c "import compileml; print(compileml.__version__)"
          compileml --help

  # Build the same artifact from the same seeded data on all three operating
  # systems (pinned numerical stack) and require byte-identical hashes.
  build-determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "numpy==2.4.2" "scikit-learn==1.8.0" "scipy==1.17.1"
      - name: Build artifact and record hash
        shell: bash
        run: |
          python .github/scripts/determinism_build.py > "hash-${{ matrix.os }}.txt"
          cat "hash-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: hash-*.txt

  build-determinism-compare:
    needs: build-determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: All three hashes must be identical
        shell: bash
        run: |
          cat hash-*.txt
          # tr strips the CRLF that Windows Python appends on redirect
          test "$(cat hash-*.txt | tr -d '\r' | sort -u | wc -l)" -eq 1
